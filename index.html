<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codespace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Codespace</a>
    <div class="top-actions">
      <button id="newProject" class="primary">Nouveau projet</button>
      <button id="exportProject">Exporter</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <div>
          <span class="eyebrow">Mes projets</span>
          <h1 id="projectCount">0 projet</h1>
        </div>
        <button id="addProject" class="icon-button" aria-label="Créer un projet">+</button>
      </div>
      <div id="projects" class="projects"></div>
    </aside>

    <section class="workspace">
      <div class="workspace-head">
        <div>
          <span class="eyebrow">Éditeur</span>
          <h2 id="projectTitle">Aucun projet</h2>
        </div>
        <div class="workspace-actions">
          <button id="runProject" class="primary">▶ Aperçu</button>
          <button id="deleteProject" class="danger">Supprimer</button>
        </div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">&lt;/&gt;</div>
        <h2>Bienvenue dans Codespace</h2>
        <p>Crée ton premier projet HTML, CSS et JavaScript.</p>
        <button id="emptyCreate" class="primary">Créer un projet</button>
      </div>

      <div id="editorArea" class="editor-area hidden">
        <div class="filebar">
          <button class="file active" data-file="html">index.html</button>
          <button class="file" data-file="css">style.css</button>
          <button class="file" data-file="js">script.js</button>
        </div>
        <div class="editor-layout">
          <div class="code-panel">
            <textarea id="codeEditor" spellcheck="false" aria-label="Éditeur de code"></textarea>
          </div>
          <div class="preview-panel">
            <div class="preview-head">
              <span>Aperçu</span>
              <button id="refreshPreview">↻</button>
            </div>
            <iframe id="preview" title="Aperçu du projet"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2>Nouveau projet</h2>
      <p>Donne un nom à ton projet.</p>
      <input id="projectName" maxlength="40" placeholder="Mon projet">
      <div class="modal-actions">
        <button id="cancelModal">Annuler</button>
        <button id="createProject" class="primary">Créer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
