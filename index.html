<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codespace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Codespace</a>
    <div class="top-actions">
      <button id="addFile">Nouveau fichier</button>
      <button id="exportProject">Exporter</button>
    </div>
  </header>

  <main class="workspace">
    <section class="project-head">
      <div>
        <span class="eyebrow">Workspace</span>
        <h1 id="projectTitle">Mon espace</h1>
      </div>
      <div class="project-actions">
        <button id="renameProject">Renommer</button>
        <button id="resetProject" class="danger">Tout supprimer</button>
      </div>
    </section>

    <section class="editor-area">
      <aside class="file-sidebar">
        <div class="file-head">
          <span>Fichiers</span>
          <button id="quickAdd" aria-label="Ajouter un fichier">+</button>
        </div>
        <div id="files" class="files"></div>
      </aside>

      <div class="code-panel">
        <div class="code-head">
          <span id="currentFile">index.html</span>
          <button id="deleteFile" class="delete-file">Supprimer</button>
        </div>
        <textarea id="codeEditor" spellcheck="false" aria-label="Éditeur de code"></textarea>
      </div>

      <div class="preview-panel">
        <div class="preview-head">
          <span>Aperçu</span>
          <button id="refreshPreview">↻</button>
        </div>
        <iframe id="preview" title="Aperçu du projet"></iframe>
      </div>
    </section>
  </main>

  <div id="fileModal" class="modal hidden">
    <div class="modal-card">
      <h2>Nouveau fichier</h2>
      <p>Ajoute un fichier HTML, CSS ou JavaScript.</p>
      <input id="fileName" maxlength="80" placeholder="exemple.html">
      <div class="modal-actions">
        <button id="cancelFile">Annuler</button>
        <button id="createFile" class="primary">Créer</button>
      </div>
    </div>
  </div>

  <div id="renameModal" class="modal hidden">
    <div class="modal-card">
      <h2>Nom du workspace</h2>
      <input id="workspaceName" maxlength="40" placeholder="Mon espace">
      <div class="modal-actions">
        <button id="cancelRename">Annuler</button>
        <button id="saveRename" class="primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
